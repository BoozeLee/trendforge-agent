[package]
name = "trendforge-agent"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "trendforge"
path = "src/main.rs"

[[bin]]
name = "register"
path = "src/bin/register.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
solana-sdk = "2.1"
solana-client = "2.1"
solana-rpc-client = "2.1"
solana-rpc-client-api = "2.1"
solana-account-decoder-client-types = "2.1"
spl-token = { version = "6", features = ["no-entrypoint"] }
spl-associated-token-account = { version = "8", features = ["no-entrypoint"] }
borsh = { version = "1", features = ["derive"] }
sha2 = "0.10"
dotenv = "0.15"
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
bs58 = "0.5"
hex = "0.4"
urlencoding = "2"
axum = { version = "0.7", features = ["macros"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["trace"] }
bincode = "1"
